aid: enverus
name: Enverus
description: >-
  Enverus is an energy-dedicated SaaS company providing analytics, market
  intelligence, and workflow automation across the global energy value chain —
  oil and gas, power and renewables, minerals, midstream, trading and risk, and
  financial services. Its developer surface is the Enverus DirectAccess API
  (formerly Drillinginfo DirectAccess), a token-authenticated REST API that
  delivers bulk access to Enverus' energy datasets — well origins, rigs,
  permits, producing entities, production, and related upstream data — with
  server-side filter functions, field selection, and cursor-based pagination.
  Enverus serves 8,000+ companies and 35,000+ energy customers from its Austin,
  Texas headquarters.
